colorScheme = "terminal"
defaultAppearance = "light"
autoSwitchAppearance = true
enableSearch = true
enableCodeCopy = true

[homepage]
  layout = "hero"
  homepageImage = "hero-terminal.svg"
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/posts/"

[article]
  showDate = true
  showAuthor = false
  showBreadcrumbs = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showWordCount = false

[list]
  showBreadcrumbs = true
  showSummary = true
