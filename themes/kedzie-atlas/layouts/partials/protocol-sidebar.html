{{ with .Params.protocols }}
  <aside class="protocol-sidebar" aria-labelledby="protocol-sidebar-title">
    <p class="protocol-sidebar-kicker">TCP/IP 4계층</p>
    <h2 id="protocol-sidebar-title">이 글의 프로토콜</h2>
    <ol class="protocol-sidebar-list">
      {{ range sort . "layer" "desc" }}
        <li class="protocol-sidebar-item">
          <div class="protocol-sidebar-layer">
            <span>L{{ index . "layer" }}</span>
            <span>{{ index . "layer_name" }}</span>
          </div>
          <strong>{{ index . "name" }}</strong>
          <span class="protocol-sidebar-pdu">PDU · {{ index . "pdu" }}</span>
          {{ with index . "section" }}<a class="protocol-sidebar-section" href="#{{ . | anchorize }}">본문: {{ . }}</a>{{ end }}
        </li>
      {{ end }}
    </ol>
  </aside>
{{ end }}
