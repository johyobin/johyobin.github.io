{{ if site.Params.enableSearch }}
<section id="search-panel" class="search-panel" hidden role="dialog" aria-modal="true" aria-labelledby="search-title">
  <div class="search-box">
    <div class="search-head">
      <h2 id="search-title">검색</h2>
      <button class="icon-button search-close" type="button" aria-label="검색 닫기">×</button>
    </div>
    <label class="search-field">
      <span>키워드</span>
      <input id="search-query" type="search" autocomplete="off" placeholder="GitOps, HPA, TargetGroupBinding">
    </label>
    <div id="search-results" class="search-results" role="list" aria-live="polite"></div>
  </div>
</section>
{{ end }}
