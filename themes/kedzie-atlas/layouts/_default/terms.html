{{ define "main" }}
  <section class="collection-page">
    <header class="collection-header narrow">
      <p class="eyebrow">INDEX</p>
      <h1>{{ .Title }}</h1>
    </header>
    <div class="term-grid">
      {{ range .Data.Terms.Alphabetical }}
        <a class="term-card" href="{{ .Page.RelPermalink }}"><span>{{ .Count }}</span>{{ .Page.Title }}</a>
      {{ end }}
    </div>
  </section>
{{ end }}
