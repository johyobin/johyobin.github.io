<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Deep-space nebula with a ringed planet</title>
  <desc id="desc">A midnight sky scattered with stars, a violet nebula, and a glowing blue ringed planet.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#020617"/>
      <stop offset=".52" stop-color="#11103a"/>
      <stop offset="1" stop-color="#04162e"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="45%" r="55%">
      <stop stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#7c3aed" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="32%" cy="25%" r="78%">
      <stop stop-color="#cffafe"/>
      <stop offset=".24" stop-color="#38bdf8"/>
      <stop offset=".62" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#172554"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="stars" width="160" height="120" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="20" r="1.3" fill="#fff" opacity=".78"/>
      <circle cx="97" cy="35" r=".8" fill="#bae6fd" opacity=".72"/>
      <circle cx="137" cy="88" r="1.1" fill="#e9d5ff" opacity=".7"/>
      <circle cx="42" cy="102" r=".65" fill="#fff" opacity=".58"/>
      <circle cx="72" cy="72" r=".45" fill="#fff" opacity=".52"/>
    </pattern>
  </defs>
  <rect width="1600" height="720" fill="url(#sky)"/>
  <ellipse cx="920" cy="250" rx="680" ry="315" fill="#7c3aed" opacity=".2" filter="url(#blur)"/>
  <rect width="1600" height="720" fill="url(#nebula)"/>
  <rect width="1600" height="720" fill="url(#stars)"/>
  <g transform="translate(1260 440)">
    <ellipse cx="0" cy="20" rx="310" ry="68" fill="none" stroke="#a5f3fc" stroke-opacity=".45" stroke-width="18" transform="rotate(-16)" filter="url(#glow)"/>
    <ellipse cx="0" cy="20" rx="310" ry="68" fill="none" stroke="#67e8f9" stroke-opacity=".85" stroke-width="8" transform="rotate(-16)"/>
    <circle r="183" fill="#38bdf8" opacity=".4" filter="url(#glow)"/>
    <circle r="170" fill="url(#planet)"/>
    <path d="M-126-93C-47-151 71-150 135-80 49-99-43-69-126-20Z" fill="#e0f2fe" opacity=".2"/>
    <path d="M-160 37C-76 12 80 6 159 50" fill="none" stroke="#1e3a8a" stroke-width="22" opacity=".48"/>
  </g>
  <g fill="#e0f2fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity=".55">
    <text x="106" y="126" font-size="16" letter-spacing="4">ORBITAL LOGBOOK</text>
    <text x="106" y="158" font-size="13" letter-spacing="2">SYSTEMS · RELIABILITY · EXPLORATION</text>
  </g>
</svg>
