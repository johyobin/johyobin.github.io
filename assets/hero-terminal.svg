<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Terminal-inspired developer background</title>
  <desc id="desc">A dark terminal screen with a subtle grid and green command-line text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#07110d"/>
      <stop offset=".52" stop-color="#0b1d16"/>
      <stop offset="1" stop-color="#10271d"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="16%" r="70%">
      <stop stop-color="#4ade80" stop-opacity=".25"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#86efac" stroke-opacity=".09"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <rect width="1600" height="720" fill="url(#glow)"/>
  <circle cx="1300" cy="80" r="180" fill="#22c55e" fill-opacity=".18" filter="url(#soft)"/>
  <g fill="#bbf7d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" opacity=".52">
    <text x="110" y="130">$ kubectl get deployments --all-namespaces</text>
    <text x="110" y="174">NAMESPACE     NAME              READY   UP-TO-DATE   AVAILABLE</text>
    <text x="110" y="218">production    service-api       3/3     3            3</text>
    <text x="110" y="262">platform      gitops-controller 2/2     2            2</text>
  </g>
  <g fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" opacity=".38">
    <text x="1010" y="500">status: healthy</text>
    <text x="1010" y="538">sync: complete</text>
    <text x="1010" y="576">latency: 42ms</text>
  </g>
  <rect x="110" y="304" width="14" height="25" rx="2" fill="#4ade80">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
